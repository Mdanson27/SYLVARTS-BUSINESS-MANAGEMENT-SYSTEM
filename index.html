<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11101f">
<title>Sylvarts Fashion Collection | Business Manager</title>
<style>
:root{--navy:#11101f;--navy2:#201c36;--pink:#e90078;--cyan:#00bfd3;--bg:#f6f7fb;--white:#fff;--ink:#191924;--muted:#777887;--line:#e8e9ef;--green:#0f9f6e;--amber:#f59e0b;--red:#d93b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.loader{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#2c2646,var(--navy) 60%);display:grid;place-items:center;color:#fff;transition:.5s}.loader.hide{opacity:0;visibility:hidden}.loaderBox{text-align:center}.logoMark{width:112px;height:112px;border-radius:50%;margin:auto;display:grid;place-items:center;background:var(--navy);border:5px solid white;box-shadow:0 0 0 7px rgba(255,255,255,.08);position:relative;animation:pulse 1.4s infinite}.logoMark b{font-size:28px;color:#fff}.logoMark:after{content:"";position:absolute;inset:-16px;border:3px solid transparent;border-top-color:var(--pink);border-right-color:var(--cyan);border-radius:50%;animation:spin 1.3s linear infinite}.loader h1{font-size:24px;margin:24px 0 6px}.loader p{color:#cbc8d5}.bar{height:4px;width:240px;background:#ffffff20;margin:18px auto;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:45%;background:linear-gradient(90deg,var(--pink),var(--cyan));animation:load 1.2s infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(230%)}}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--navy);color:white;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{padding:10px 10px 25px;display:flex;gap:12px;align-items:center}.mini{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;border:3px solid var(--pink)}.brand strong{display:block}.brand small{color:#aaa8ba}.nav button{display:flex;width:100%;border:0;background:transparent;color:#c8c6d3;padding:13px 14px;border-radius:12px;margin:4px 0;text-align:left;gap:10px}.nav button.active,.nav button:hover{background:#ffffff12;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--pink)}.sideFoot{position:absolute;bottom:18px;left:22px;font-size:12px;color:#aaa8ba}.sideFoot a{color:#fff;text-decoration:none}.main{min-width:0}.top{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.eyebrow{font-size:10px;letter-spacing:.13em;color:var(--pink);font-weight:800;margin:0}.top h2{margin:4px 0 0}.actions{display:flex;align-items:center;gap:10px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--pink);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f1;color:var(--red)}.content{padding:28px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(15,15,30,.04)}.kpi p{margin:0;color:var(--muted);font-size:12px}.kpi h3{font-size:24px;margin:8px 0 4px}.kpi small{color:var(--green)}.split{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.titleRow h3{margin:0}.muted{color:var(--muted);font-size:12px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}.ok{background:#e9fbf4;color:var(--green)}.low{background:#fff7e7;color:#b06b00}.out{background:#fff0f1;color:var(--red)}.pending{background:#fff7e7;color:#b06b00}.paid{background:#e9fbf4;color:var(--green)}.draft{background:#f0f1f5;color:#777}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.control{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:150px}.alert{display:flex;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.alert p{margin:4px 0 0;color:var(--muted);font-size:12px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formGrid label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.formGrid input,.formGrid select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.modalBack{position:fixed;inset:0;background:#0b0a15aa;display:grid;place-items:center;z-index:50;padding:18px}.modalBack.hidden{display:none}.modal{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:18px}.modalHead,.modalFoot{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modalFoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.modalBody{padding:20px}.close{border:0;background:transparent;font-size:24px}.chart{height:220px;display:flex;align-items:flex-end;gap:8px;padding:20px 4px 0}.chart i{flex:1;background:linear-gradient(var(--pink),#ff7bbd);border-radius:6px 6px 2px 2px;min-width:8px}.chartLabels{display:flex;gap:8px}.chartLabels span{flex:1;text-align:center;font-size:9px;color:var(--muted)}.mobileMenu{display:none}.notice{background:linear-gradient(120deg,var(--navy2),var(--navy));color:#fff;border-radius:16px;padding:18px}.notice strong{color:#fff}.notice p{color:#c7c5d3}.summaryLine{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:1000px){.grid4{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:fixed;z-index:40;left:-270px;width:250px;transition:.25s}.side.open{left:0}.mobileMenu{display:inline-block}.content{padding:18px}.top{padding:0 16px}.actions .secondary{display:none}}@media(max-width:620px){.grid4,.formGrid{grid-template-columns:1fr}.actions .profile{display:none}.top h2{font-size:18px}.primary{padding:9px 11px}.content{padding:14px}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loaderBox"><div class="logoMark"><b>SFC</b></div><h1>Sylvarts Fashion Collection</h1><p>Preparing your business dashboard...</p><div class="bar"><span></span></div></div></div>
<div class="shell">
<aside class="side" id="side"><div class="brand"><div class="mini">SF</div><div><strong>Sylvarts</strong><small>Business Manager</small></div></div><div class="nav" id="nav">
<button class="active" data-view="dashboard">▣ Dashboard</button><button data-view="inventory">▦ Inventory</button><button data-view="sales">↗ Sales</button><button data-view="receipts">▤ Receipts</button><button data-view="invoices">▧ Invoices</button><button data-view="tracking">◎ Tracking</button><button data-view="reports">▥ Reports</button><button data-view="settings">⚙ Settings</button></div><div class="sideFoot"><a href="https://www.tiktok.com/@sylvartsfashioncolection" target="_blank">TikTok ↗</a><br>Demo v1.0</div></aside>
<main class="main"><header class="top"><div style="display:flex;gap:12px;align-items:center"><button class="secondary mobileMenu" id="menu">☰</button><div><p class="eyebrow">SYLVARTS FASHION COLLECTION</p><h2 id="pageTitle">Dashboard</h2></div></div><div class="actions"><button class="primary" onclick="openSale()">+ New Sale</button><button class="secondary" onclick="showLow()">🔔</button><div class="profile"><b>Demo Admin</b><div class="muted">Manager</div></div></div></header><section class="content" id="content"></section></main>
</div>
<div class="modalBack hidden" id="modalBack"><div class="modal" id="modal"></div></div>
<script>
const seed={products:[{id:'SF-001',name:'Elegant Handbag - Rose',category:'Handbags',cost:85000,price:135000,stock:12,reorder:5},{id:'SF-002',name:'Classic Ladies Handbag - Black',category:'Handbags',cost:90000,price:145000,stock:4,reorder:6},{id:'SF-003',name:'Patterned Midi Dress',category:'Dresses',cost:65000,price:110000,stock:8,reorder:4},{id:'SF-004',name:'Premium Office Dress',category:'Dresses',cost:72000,price:125000,stock:3,reorder:5},{id:'SF-005',name:'Statement Earrings',category:'Accessories',cost:12000,price:30000,stock:24,reorder:8},{id:'SF-006',name:'Ladies Sandals',category:'Shoes',cost:55000,price:90000,stock:2,reorder:4},{id:'SF-007',name:'Silk Scarf',category:'Accessories',cost:18000,price:40000,stock:15,reorder:6},{id:'SF-008',name:'Weekend Tote',category:'Handbags',cost:98000,price:155000,stock:0,reorder:3}],sales:[{id:'SALE-1048',date:'2026-08-20',customer:'Walk-in Customer',total:175000,payment:'Mobile Money'},{id:'SALE-1047',date:'2026-08-19',customer:'Amina N.',total:145000,payment:'Cash'},{id:'SALE-1046',date:'2026-08-19',customer:'Sarah K.',total:245000,payment:'Mobile Money'}],receipts:[{id:'RCT-038',date:'2026-08-20',customer:'Walk-in Customer',amount:175000,payment:'Mobile Money'}],invoices:[{id:'INV-014',date:'2026-08-20',customer:'Amina N.',amount:290000,status:'Paid'},{id:'INV-013',date:'2026-08-19',customer:'Nansubuga Joan',amount:375000,status:'Pending'},{id:'INV-012',date:'2026-08-17',customer:'Grace Boutique',amount:620000,status:'Draft'}],activity:['Sale SALE-1048 recorded','Ladies Sandals reached low stock','Invoice INV-014 created','Statement Earrings stock adjusted']};
const key='sylvarts-demo-v1';let state=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(seed);let view='dashboard';const money=n=>'UGX '+Number(n||0).toLocaleString();const save=()=>localStorage.setItem(key,JSON.stringify(state));const low=()=>state.products.filter(p=>p.stock<=p.reorder);const salesTotal=()=>state.sales.reduce((a,b)=>a+b.total,0);const inventoryValue=()=>state.products.reduce((a,b)=>a+b.cost*b.stock,0);const retailValue=()=>state.products.reduce((a,b)=>a+b.price*b.stock,0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
setTimeout(()=>document.getElementById('loader').classList.add('hide'),900);document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;document.getElementById('pageTitle').textContent=b.textContent.trim().replace(/^[^A-Za-z]+/,'');document.getElementById('side').classList.remove('open');render()});
function render(){const c=document.getElementById('content');if(view==='dashboard')c.innerHTML=dashboard();if(view==='inventory')c.innerHTML=inventory();if(view==='sales')c.innerHTML=sales();if(view==='receipts')c.innerHTML=receipts();if(view==='invoices')c.innerHTML=invoices();if(view==='tracking')c.innerHTML=tracking();if(view==='reports')c.innerHTML=reports();if(view==='settings')c.innerHTML=settings();bind();}
function dashboard(){return `<div class="grid4"><div class="card kpi"><p>Total Sales Revenue</p><h3>${money(salesTotal())}</h3><small>Demo transactions</small></div><div class="card kpi"><p>Inventory at Cost</p><h3>${money(inventoryValue())}</h3><small>${state.products.length} products</small></div><div class="card kpi"><p>Low Stock Items</p><h3>${low().length}</h3><small>Needs attention</small></div><div class="card kpi"><p>Outstanding Invoices</p><h3>${money(state.invoices.filter(i=>i.status!=='Paid').reduce((a,b)=>a+b.amount,0))}</h3><small>Pending + draft</small></div></div><div class="split"><div class="card"><div class="titleRow"><div><h3>Sales Trend</h3><span class="muted">12-month demo view</span></div></div><div class="chart">${[42,55,48,64,72,69,81,76,90,84,98,105].map(v=>`<i style="height:${v/1.15}%"></i>`).join('')}</div><div class="chartLabels">${['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="card"><div class="titleRow"><h3>Stock Alerts</h3><button class="secondary" onclick="go('inventory')">Open inventory</button></div>${low().slice(0,5).map(p=>`<div class="alert"><div><strong>${esc(p.name)}</strong><p>${p.stock} in stock · reorder at ${p.reorder}</p></div><span class="badge ${p.stock===0?'out':'low'}">${p.stock===0?'Out':'Low'}</span></div>`).join('')||'<p class="muted">All stock levels are healthy.</p>'}</div></div><div class="split"><div class="card"><div class="titleRow"><h3>Recent Sales</h3></div><div class="tableWrap"><table class="table"><thead><tr><th>Sale</th><th>Date</th><th>Customer</th><th>Payment</th><th>Total</th></tr></thead><tbody>${state.sales.slice(0,5).map(s=>`<tr><td><b>${s.id}</b></td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${s.payment}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div></div><div class="notice"><strong>Demo Ready</strong><p>This prototype lets Sylvarts demonstrate stock control, reorder alerts, sales, receipt creation, invoices and management tracking without a backend.</p><button class="primary" onclick="openSale()">Record a Demo Sale</button></div></div>`}
function inventory(){return `<div class="card"><div class="titleRow"><div><h3>Inventory Management</h3><span class="muted">Stock levels and automatic reorder warnings</span></div><div class="toolbar"><input class="control" id="search" placeholder="Search products"><button class="primary" onclick="openProduct()">+ Add Product</button></div></div><div class="tableWrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Cost</th><th>Selling</th><th>Stock</th><th>Reorder</th><th>Status</th><th></th></tr></thead><tbody id="invRows">${productRows(state.products)}</tbody></table></div></div>`}
function productRows(items){return items.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${p.category}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.reorder}</td><td><span class="badge ${p.stock===0?'out':p.stock<=p.reorder?'low':'ok'}">${p.stock===0?'Out':p.stock<=p.reorder?'Reorder':'Healthy'}</span></td><td><button class="secondary" onclick="openProduct('${p.id}')">Edit</button></td></tr>`).join('')}
function sales(){return `<div class="grid4"><div class="card kpi"><p>Recorded Sales</p><h3>${state.sales.length}</h3></div><div class="card kpi"><p>Revenue</p><h3>${money(salesTotal())}</h3></div><div class="card kpi"><p>Average Sale</p><h3>${money(state.sales.length?salesTotal()/state.sales.length:0)}</h3></div><div class="card kpi"><p>Today</p><h3>${state.sales.filter(s=>s.date==='2026-08-20').length}</h3></div></div><div class="card" style="margin-top:16px"><div class="titleRow"><h3>Sales Register</h3><button class="primary" onclick="openSale()">+ New Sale</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Sale</th><th>Date</th><th>Customer</th><th>Payment</th><th>Total</th></tr></thead><tbody>${state.sales.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.date}</td><td>${esc(s.customer)}</td><td>${s.payment}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div></div>`}
function receipts(){return `<div class="card"><div class="titleRow"><div><h3>Receipts</h3><span class="muted">Payment records created from sales or manually</span></div><button class="primary" onclick="openDoc('receipt')">+ Make Receipt</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Payment</th><th>Amount</th></tr></thead><tbody>${state.receipts.map(r=>`<tr><td><b>${r.id}</b></td><td>${r.date}</td><td>${esc(r.customer)}</td><td>${r.payment}</td><td>${money(r.amount)}</td></tr>`).join('')}</tbody></table></div></div>`}
function invoices(){return `<div class="card"><div class="titleRow"><div><h3>Invoices</h3><span class="muted">Create and track customer invoices</span></div><button class="primary" onclick="openDoc('invoice')">+ Make Invoice</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>${state.invoices.map(i=>`<tr><td><b>${i.id}</b></td><td>${i.date}</td><td>${esc(i.customer)}</td><td>${money(i.amount)}</td><td><span class="badge ${i.status.toLowerCase()}">${i.status}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function tracking(){const pending=state.invoices.filter(i=>i.status!=='Paid');return `<div class="split"><div class="card"><div class="titleRow"><h3>Reorder Tracking</h3></div>${low().map(p=>`<div class="alert"><div><strong>${esc(p.name)}</strong><p>Stock ${p.stock} · reorder level ${p.reorder}</p></div><span class="badge ${p.stock===0?'out':'low'}">${p.stock===0?'OUT':'ORDER'}</span></div>`).join('')}</div><div class="card"><div class="titleRow"><h3>Payment Follow-up</h3></div>${pending.map(i=>`<div class="alert"><div><strong>${i.id}</strong><p>${esc(i.customer)} · ${money(i.amount)}</p></div><span class="badge ${i.status.toLowerCase()}">${i.status}</span></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><div class="titleRow"><h3>Business Activity</h3></div>${state.activity.map(a=>`<div class="summaryLine"><span>${esc(a)}</span><span class="muted">Demo</span></div>`).join('')}</div>`}
function reports(){const margin=retailValue()-inventoryValue();return `<div class="grid4"><div class="card kpi"><p>Sales Revenue</p><h3>${money(salesTotal())}</h3></div><div class="card kpi"><p>Stock at Cost</p><h3>${money(inventoryValue())}</h3></div><div class="card kpi"><p>Stock Retail Value</p><h3>${money(retailValue())}</h3></div><div class="card kpi"><p>Potential Gross Margin</p><h3>${money(margin)}</h3></div></div><div class="split"><div class="card"><div class="titleRow"><h3>Category Stock</h3></div>${[...new Set(state.products.map(p=>p.category))].map(cat=>{let x=state.products.filter(p=>p.category===cat);return `<div class="summaryLine"><span>${cat}</span><b>${x.reduce((a,b)=>a+b.stock,0)} units</b></div>`}).join('')}</div><div class="card"><div class="titleRow"><h3>Management Snapshot</h3></div><div class="summaryLine"><span>Products</span><b>${state.products.length}</b></div><div class="summaryLine"><span>Low / Out of stock</span><b>${low().length}</b></div><div class="summaryLine"><span>Invoices</span><b>${state.invoices.length}</b></div><div class="summaryLine"><span>Receipts</span><b>${state.receipts.length}</b></div></div></div>`}
function settings(){return `<div class="card"><h3>Demo Settings</h3><p class="muted">The current demo saves changes in this browser using localStorage.</p><div class="notice" style="margin-top:18px"><strong>Production upgrade</strong><p>Next stage: secure login, role permissions, cloud database, backups, suppliers, purchases, barcode scanning, expenses, detailed profit reports and multi-user audit logs.</p></div><button class="danger" style="margin-top:18px" onclick="resetDemo()">Reset Demo Data</button></div>`}
function bind(){let s=document.getElementById('search');if(s)s.oninput=()=>{let q=s.value.toLowerCase();document.getElementById('invRows').innerHTML=productRows(state.products.filter(p=>(p.name+p.id+p.category).toLowerCase().includes(q)))}}
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('pageTitle').textContent=v[0].toUpperCase()+v.slice(1);render()}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.remove('hidden')}function closeModal(){document.getElementById('modalBack').classList.add('hidden')}document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
function openProduct(id){let p=id?state.products.find(x=>x.id===id):null;modal(`<div class="modalHead"><h3>${p?'Edit':'Add'} Product</h3><button class="close" onclick="closeModal()">×</button></div><form id="productForm"><div class="modalBody"><div class="formGrid"><div><label>SKU</label><input name="id" required value="${p?p.id:'SF-'+String(state.products.length+1).padStart(3,'0')}" ${p?'readonly':''}></div><div><label>Product Name</label><input name="name" required value="${p?esc(p.name):''}"></div><div><label>Category</label><select name="category">${['Handbags','Dresses','Shoes','Accessories','Other'].map(x=>`<option ${p&&p.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Cost Price</label><input name="cost" type="number" min="0" required value="${p?p.cost:''}"></div><div><label>Selling Price</label><input name="price" type="number" min="0" required value="${p?p.price:''}"></div><div><label>Stock</label><input name="stock" type="number" min="0" required value="${p?p.stock:0}"></div><div><label>Reorder Level</label><input name="reorder" type="number" min="0" required value="${p?p.reorder:3}"></div></div></div><div class="modalFoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Product</button></div></form>`);document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));['cost','price','stock','reorder'].forEach(k=>f[k]=Number(f[k]));if(p)Object.assign(p,f);else state.products.unshift(f);state.activity.unshift((p?'Updated ':'Added ')+f.name);save();closeModal();render()}}
function openSale(){let available=state.products.filter(p=>p.stock>0);modal(`<div class="modalHead"><h3>Record New Sale</h3><button class="close" onclick="closeModal()">×</button></div><form id="saleForm"><div class="modalBody"><div class="formGrid"><div><label>Customer</label><input name="customer" value="Walk-in Customer"></div><div><label>Payment</label><select name="payment"><option>Mobile Money</option><option>Cash</option><option>Bank Transfer</option></select></div><div><label>Product</label><select name="product">${available.map(p=>`<option value="${p.id}">${esc(p.name)} · ${money(p.price)} · ${p.stock} left</option>`).join('')}</select></div><div><label>Quantity</label><input name="qty" type="number" min="1" value="1"></div></div></div><div class="modalFoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Complete Sale</button></div></form>`);document.getElementById('saleForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let p=state.products.find(x=>x.id===f.product),q=Number(f.qty);if(!p||q>p.stock)return alert('Not enough stock');p.stock-=q;let total=p.price*q,id='SALE-'+(1049+state.sales.length);state.sales.unshift({id,date:new Date().toISOString().slice(0,10),customer:f.customer||'Walk-in Customer',total,payment:f.payment});state.receipts.unshift({id:'RCT-'+(39+state.receipts.length),date:new Date().toISOString().slice(0,10),customer:f.customer||'Walk-in Customer',amount:total,payment:f.payment});state.activity.unshift(`Sale ${id} recorded · ${money(total)}`);save();closeModal();go('sales')}}
function openDoc(type){let inv=type==='invoice';modal(`<div class="modalHead"><h3>Create ${inv?'Invoice':'Receipt'}</h3><button class="close" onclick="closeModal()">×</button></div><form id="docForm"><div class="modalBody"><div class="formGrid"><div><label>Customer</label><input name="customer" required></div><div><label>Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div><label>Amount</label><input name="amount" type="number" min="1" required></div><div><label>${inv?'Status':'Payment'}</label><select name="status"><option>${inv?'Draft':'Mobile Money'}</option><option>${inv?'Pending':'Cash'}</option><option>${inv?'Paid':'Bank Transfer'}</option></select></div></div></div><div class="modalFoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Create</button></div></form>`);document.getElementById('docForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount);if(inv){f.id='INV-'+String(15+state.invoices.length).padStart(3,'0');state.invoices.unshift(f);state.activity.unshift(`Invoice ${f.id} created`)}else{f.id='RCT-'+String(39+state.receipts.length).padStart(3,'0');f.payment=f.status;delete f.status;state.receipts.unshift(f);state.activity.unshift(`Receipt ${f.id} created`)}save();closeModal();render()}}
function showLow(){go('tracking')}function resetDemo(){if(confirm('Reset all demo changes?')){state=structuredClone(seed);save();render()}}render();
</script>
